# Refresh Message Center, Microsoft 365 Roadmap and Azure Updates data

name: update-m365-data

on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '@data/**'
  pull_request:
    branches: [ "main" ]
  # Refresh data hourly. Runs at :17 rather than :00 because GitHub's
  # best-effort scheduler sheds load at the top of the hour first, so an
  # off-peak minute is less likely to be delayed or dropped.
  schedule:
    - cron:  '17 * * * *'

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      # Normally only what changed is sent to zap.ms. Use this once after zap.ms
      # gains a feature that needs everything, or to repair a gap.
      republish:
        description: "Send every post record and version history to zap.ms again"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write
  # Needed to dispatch the site build after pushing new data.
  actions: write

# Serialize refreshes so a delayed scheduled run can't race a later one and
# fail its push; queued runs coalesce while one is in progress.
concurrency:
  group: "data-refresh"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          # Refreshes run one at a time, so an earlier one may have pushed by
          # the time a queued run starts. Take the branch as it is now rather
          # than the commit that triggered the run, or this run's own push is
          # rejected. Pull requests keep the default, their merge commit.
          ref: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
      - name: Get Message Center, Roadmap and Azure data
        env:
          DISCORD_ENTRA_SCOUT_WEBHOOK_URL: ${{ secrets.DISCORD_ENTRA_SCOUT_WEBHOOK_URL }}
          # Pull request runs are checks only. Their Discord state is never
          # committed, so posting from them would repeat on the next refresh.
          DISCORD_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          # Discussion service ingest. Like Discord, pull request runs send
          # nothing: the token is only passed on main branch runs. Leave the
          # variable unset to switch publishing off.
          ZAP_INGEST_URL: ${{ vars.ZAP_INGEST_URL }}
          ZAP_INGEST_TOKEN: ${{ github.event_name != 'pull_request' && secrets.ZAP_INGEST_TOKEN || '' }}
          ZAP_REPUBLISH_ALL: ${{ inputs.republish && 'true' || 'false' }}
          # Second tenant, authenticated with a federated identity credential (no secret).
          # Leave the variables unset to keep the refresh on the primary tenant only.
          GRAPH_FEDERATED_TENANT_ID: ${{ vars.GRAPH_FEDERATED_TENANT_ID }}
          GRAPH_FEDERATED_CLIENT_ID: ${{ vars.GRAPH_FEDERATED_CLIENT_ID }}
          # Community contributed tenants that consented to the multi-tenant app.
          # The tenant list is a secret so contributors stay private; it is only
          # passed on main branch runs, which the federated credential trusts.
          GRAPH_CONTRIBUTOR_TENANTS: ${{ github.event_name != 'pull_request' && secrets.GRAPH_CONTRIBUTOR_TENANTS || '' }}
        # Pull request runs skip Message Center, so the check needs no tenant,
        # does not depend on Microsoft Graph and is never passed the secret.
        # The rest of the refresh runs on the posts already in the repo.
        run: |
          ./@build/Update-Site.ps1 ${{ github.event_name == 'pull_request' && '-RoadmapOnly' || format('-GraphSecret {0}', secrets.GRAPH_SECRET) }}
        shell: pwsh
        
      - name: Update repo
        id: commit
        # A pull request checkout is a detached merge commit that cannot be
        # pushed; the data refresh there only verifies the build scripts.
        if: github.event_name != 'pull_request'
        run: |
          if [[ `git status --porcelain` ]]; then
            # Changes
            echo "Updating repo"
            git config --global user.name 'Merill Fernando'
            git config --global user.email 'merill@users.noreply.github.com'
            git add -A && git commit -m "Daily automation"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            # No changes
            echo "No changes"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      # The push above can never start the site build by itself: commits made
      # with the workflow's GITHUB_TOKEN do not fire push-triggered workflows
      # (GitHub's recursion guard). workflow_dispatch is the documented
      # exception, so kick the build explicitly instead of waiting up to four
      # hours for the site workflow's fallback cron.
      - name: Rebuild site with new data
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-mc-site.yml --ref main

      # Self-healing fallback: if a rebuild was missed (dropped cron slot,
      # failed dispatch, failed build or deploy), this hourly run notices the
      # live site serving older data than the repo and dispatches a rebuild.
      # Skipped when this run just pushed (the step above already dispatched)
      # and when a build is already queued or running.
      - name: Rebuild site if live site is stale
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_max=$(jq -r '[.[].LastModifiedDateTime // empty] | max // empty' '@data/messages-index.json')
          live_max=$(curl -sf --max-time 30 https://mc.merill.net/messages-index.json | jq -r '[.[].LastModifiedDateTime // empty] | max // empty' || true)
          echo "repo: ${repo_max:-none} live: ${live_max:-unreachable}"
          if [ -z "$repo_max" ] || [ -z "$live_max" ]; then
            echo "Skipping freshness check (index missing or live site unreachable)."
            exit 0
          fi
          if [[ "$repo_max" > "$live_max" ]]; then
            active=$(gh run list --workflow update-mc-site.yml --status in_progress --json databaseId --jq length)
            queued=$(gh run list --workflow update-mc-site.yml --status queued --json databaseId --jq length)
            if [ "$active" = "0" ] && [ "$queued" = "0" ]; then
              echo "Live site is stale; dispatching a rebuild."
              gh workflow run update-mc-site.yml --ref main
              echo "Live site was stale (site $live_max, repo $repo_max); rebuild dispatched." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "A site build is already queued or running; not dispatching another."
            fi
          else
            echo "Live site is up to date."
          fi

  # Pull requests also run the unit tests, which need nothing outside the repo.
  # The refresh above only shows that the scripts still run end to end.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The major version the refresh scripts run on in the job above.
          node-version: "22"
          cache: npm
      # Some of the tests load the site's TypeScript sources.
      - name: Install dependencies
        run: npm ci
      - name: Test the refresh scripts and site logic
        run: node --test scripts/test-*.mjs
      - name: Test the Entra post filter
        run: npm run test:entra-filter
      - name: Test the tenant merge
        run: npm run test:tenants
